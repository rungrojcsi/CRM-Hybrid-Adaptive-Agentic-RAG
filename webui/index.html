<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSI CRM Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 760px;
      height: 90vh;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: #0078d4;
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .icon { font-size: 24px; }
    header h1 { font-size: 18px; font-weight: 600; }
    header p  { font-size: 12px; opacity: 0.8; margin-top: 2px; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 90%;
    }

    .msg.user  { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot   { align-self: flex-start; }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .msg.user .avatar  { background: #0078d4; color: #fff; }
    .msg.bot  .avatar  { background: #e8f0fe; color: #0078d4; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .msg.user .bubble {
      background: #0078d4;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.bot .bubble {
      background: #f5f7fa;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }

    .sources {
      margin-top: 8px;
      font-size: 11px;
      color: #888;
      border-top: 1px solid #eee;
      padding-top: 6px;
    }

    .typing {
      display: flex; gap: 4px; align-items: center;
      padding: 12px 16px;
      background: #f5f7fa;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #0078d4; opacity: 0.6;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    footer {
      padding: 16px 20px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      border: 1.5px solid #ddd;
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    #input:focus { border-color: #0078d4; }

    #send {
      background: #0078d4;
      color: #fff;
      border: none;
      border-radius: 24px;
      padding: 10px 22px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    #send:hover    { background: #005a9e; }
    #send:disabled { background: #aaa; cursor: not-allowed; }

    .hint {
      font-size: 12px; color: #aaa;
      text-align: center;
      padding: 0 20px 10px;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="icon">🏭</div>
    <div>
      <h1>CSI CRM Assistant</h1>
      <p>ถามข้อมูล Account จากระบบ CRM ได้เลยครับ</p>
    </div>
  </header>

  <div id="chat">
    <div class="msg bot">
      <div class="avatar">🤖</div>
      <div class="bubble">สวัสดีครับ ผมช่วยค้นหาข้อมูลลูกค้าจากระบบ CRM ของ CSI ได้ครับ<br><br>ตัวอย่างคำถาม:<br>• บริษัทไหนมียอดขายสูงสุด<br>• ข้อมูลบริษัท SAIC Motor<br>• ลูกค้าในอุตสาหกรรม automotive มีใครบ้าง</div>
    </div>
  </div>

  <p class="hint">Powered by Azure OpenAI GPT-4.1 + pgvector RAG</p>

  <footer>
    <input id="input" type="text" placeholder="พิมพ์คำถามเป็นภาษาไทยหรืออังกฤษ..." />
    <button id="send" onclick="sendMsg()">ส่ง</button>
  </footer>
</div>

<script>
  const FUNC_URL = "https://function-app.azurewebsites.net/api/ask";
  const FUNC_KEY = "sI0blJ5lVxl8o16drr5XI0b6DVzVIDo8s1Vkxwk21lkBAzFudbKF1w==";

  const chat  = document.getElementById("chat");
  const input = document.getElementById("input");
  const send  = document.getElementById("send");

  input.addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(); });

  function addMsg(role, text, sources) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    const avatar = role === "user" ? "👤" : "🤖";
    let inner = `<div class="avatar">${avatar}</div><div class="bubble">${escHtml(text)}`;
    if (sources && sources.length > 0) {
      const srcs = sources.map(s =>
        `[${s.chunk_seq}] ${s.account_id.substring(0,8)}… sim=${s.similarity.toFixed(3)}`
      ).join(" · ");
      inner += `<div class="sources">📎 Sources: ${srcs}</div>`;
    }
    inner += `</div>`;
    div.innerHTML = inner;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "msg bot";
    div.id = "typing";
    div.innerHTML = `<div class="avatar">🤖</div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
            .replace(/\n/g,"<br>");
  }

  async function sendMsg() {
    const q = input.value.trim();
    if (!q) return;

    input.value = "";
    send.disabled = true;
    addMsg("user", q);
    addTyping();

    try {
      const res = await fetch(`${FUNC_URL}?code=${FUNC_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ q, top_k: 5 })
      });

      const data = await res.json();
      removeTyping();

      if (data.error) {
        addMsg("bot", `❌ Error: ${data.error}`);
      } else {
        addMsg("bot", data.answer, data.sources);
      }
    } catch (err) {
      removeTyping();
      addMsg("bot", `❌ ไม่สามารถเชื่อมต่อได้: ${err.message}`);
    }

    send.disabled = false;
    input.focus();
  }
</script>
</body>
</html>
